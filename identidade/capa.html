<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;700&display=block" rel="stylesheet">
<link href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css" rel="stylesheet">
<style>
  :root {
    --fundo: #0f1115;
    --superficie: #161a20;
    --borda: #262c35;
    --texto: #e8ecf1;
    --suave: #94a0ad;
    --destaque: #1b7f8f;
    --destaque-claro: #3fb7c9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--fundo); }
  body {
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--texto);
    position: relative;
  }
  .grade {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--borda) 1px, transparent 1px),
      linear-gradient(90deg, var(--borda) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: .35;
    mask-image: radial-gradient(ellipse 70% 90% at 85% 40%, #000 20%, transparent 75%);
  }
  .brilho {
    position: absolute; width: 720px; height: 720px; right: -160px; top: -200px;
    background: radial-gradient(circle, rgba(27,127,143,.35), transparent 65%);
  }
  .barra { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--destaque); }
  .conteudo {
    position: absolute; left: 96px; top: 84px; right: 400px; bottom: 72px;
    display: flex; flex-direction: column;
  }
  .repo { font-family: "IBM Plex Mono", monospace; font-size: 24px; color: var(--suave); }
  .repo b { color: var(--destaque-claro); font-weight: 500; }
  h1 { margin-top: 28px; font-size: 76px; line-height: 1.02; font-weight: 700; letter-spacing: -2px; }
  p { margin-top: 26px; font-size: 29px; line-height: 1.35; color: var(--suave); }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 21px; font-weight: 500; padding: 8px 18px; border-radius: 999px;
    border: 1px solid var(--borda); background: var(--superficie); color: var(--texto);
  }
  .icone {
    position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
    width: 260px; height: 260px; border-radius: 56px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #1b2a30, var(--superficie));
    border: 1px solid #2b3c43;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .icone i { font-size: 128px; color: var(--destaque-claro); }
  .rodape {
    position: absolute; right: 120px; bottom: 64px; width: 260px; text-align: center;
    font-size: 20px; color: var(--suave); letter-spacing: 3px; text-transform: uppercase; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="grade"></div>
  <div class="brilho"></div>
  <div class="barra"></div>
  <div class="conteudo">
    <div class="repo">WallaksCardoso / <b id="repo"></b></div>
    <h1 id="titulo"></h1>
    <p id="descricao"></p>
    <div class="chips" id="chips"></div>
  </div>
  <div class="icone"><i id="icone"></i></div>
  <div class="rodape" id="categoria"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("repo").textContent = q.get("repo");
  document.getElementById("titulo").textContent = q.get("titulo");
  document.getElementById("descricao").textContent = q.get("descricao");
  document.getElementById("categoria").textContent = q.get("categoria");
  document.getElementById("icone").className = "icon-" + q.get("icone");
  for (const s of q.get("stack").split(",")) {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = s;
    document.getElementById("chips").appendChild(c);
  }
</script>
</body>
</html>
